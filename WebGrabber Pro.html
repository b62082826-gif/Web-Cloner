d #2A2A31;font-size:14px;color:#B9B9C3\">\n<span style=\"width:8px;height:8px;border-radius:50%;background:{{accent}}\"><\u002Fspan>แอป Windows แบบโอเพนซอร์ส\n<\u002Fdiv>\n<h1 class=\"h1\" style=\"margin:0;font-size:78px;line-height:1.08;font-weight:700;letter-spacing:-0.03em;max-width:980px;text-wrap:balance\">เก็บทั้งเว็บไซต์ไว้ในเครื่อง ให้เหลือ<span style=\"background:linear-gradient(90deg,{{accent}},#7DD3FC);-webkit-background-clip:text;background-clip:text;color:transparent\">ไฟล์เดียว<\u002Fspan><\u002Fh1>\n<p style=\"margin:0;font-size:20px;color:#A9A9B4;max-width:660px;text-wrap:balance\">WebGrabber Pro ดึงหน้าเว็บมาเก็บไว้ในคอมพิวเตอร์ จะรวม CSS, JavaScript และรูปภาพเป็นไฟล์ HTML ไฟล์เดียว หรือแยกเป็นโฟลเดอร์ให้แก้ไขง่ายก็ได้<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:4px\">\n<a class=\"btn-main\" href=\"#try\" style=\"padding:15px 30px;border-radius:999px;background:#F4F4F6;color:#0B0B0D;font-weight:600;font-size:17px\">ลองเล่นด้านล่าง<\u002Fa>\n<a class=\"btn-ghost\" href=\"https://github.com/b62082826-gif/Web-Cloner\" style=\"padding:15px 30px;border-radius:999px;background:#17171C;border:1px solid #2A2A31;color:#F4F4F6;font-weight:500;font-size:17px\">ดูบน GitHub<\u002Fa>\n<\u002Fdiv>\n<p style=\"margin:0;font-size:14px;color:#8E8E99;font-family:'JetBrains Mono',monospace\">Windows Desktop · C# บน .NET 8 · WinForms + WebView2<\u002Fp>\n\n<!-- static app window in hero -->\n<div style=\"width:100%;max-width:880px;margin-top:40px;text-align:left;border-radius:18px;background:#101012;border:1px solid #2A2A30;overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.6)\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 18px\">\n<span style=\"display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600\">\n<svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 32 32\" aria-hidden=\"true\"><rect width=\"32\" height=\"32\" rx=\"9\" fill=\"#F4F4F6\"><\u002Frect><path d=\"M7 10l3.2 12 3.3-9 3.3 9L20 10M20.5 10l2.6 12 2.4-12\" fill=\"none\" stroke=\"#0B0B0D\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" transform=\"translate(-1.5 0) scale(.96 1)\"><\u002Fpath><\u002Fsvg>WebGrabber<\u002Fspan>\n<span style=\"display:flex;gap:22px;color:#9A9AA6\" aria-hidden=\"true\">\n<svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 12 12\"><path d=\"M1.5 6h9\" stroke=\"currentColor\" stroke-width=\"1.3\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n<svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 12 12\"><rect x=\"1.5\" y=\"1.5\" width=\"9\" height=\"9\" rx=\"1.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"><\u002Frect><\u002Fsvg>\n<svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 12 12\"><path d=\"M2 2l8 8M10 2l-8 8\" stroke=\"currentColor\" stroke-width=\"1.3\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n<\u002Fspan>\n<\u002Fdiv>\n<div style=\"padding:12px 28px 32px;display:flex;flex-direction:column;gap:20px\">\n<div style=\"display:flex;flex-direction:column;gap:6px\">\n<div class=\"a-h1\" style=\"font-weight:800;letter-spacing:-0.035em;line-height:1.1\">Let's grab a website.<\u002Fdiv>\n<div style=\"font-size:16px;color:#8D8D96\">WebGrabber saves a web page with its images, fonts and styles, so you can open it offline.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:26px;border-radius:26px;background:#17171A;border:1px solid #25252A;display:flex;flex-direction:column;gap:18px\">\n<div style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px\">\n<div style=\"display:flex;align-items:center;gap:14px\">\n<span style=\"width:48px;height:48px;border-radius:14px;background:#212125;display:flex;align-items:center;justify-content:center;color:#E6E6EA\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\ gap:12px;padding:20px 42px;min-height:44px;border-radius:999px;background:#F4F4F6;color:#0B0B0D;font-weight:700;font-size:18px;opacity:{{startOpacity}}\">\n<svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 20h14\"><\u002Fpath><\u002Fsvg>{{startLabel}}<\u002Fbutton>\n<span style=\"flex:1 1 260px;font-size:15px;color:#85858F\">Takes a few seconds. Saves an offline copy you can open any time.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- DONE SCREEN -->\n<sc-if value=\"{{showDone}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"padding:24px 32px 40px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px\">\n<div style=\"width:150px;height:150px;border-radius:50%;background:#F4F4F6;display:flex;align-items:center;justify-content:center;margin-bottom:14px\">\n<svg width=\"56\" height=\"56\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0B0B0D\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\u002Fpath><\u002Fsvg>\n<\u002Fdiv>\n<div style=\"font-size:20px;color:#8D8D96\">You just saved<\u002Fdiv>\n<div class=\"a-big\" style=\"font-weight:800;letter-spacing:-0.04em;line-height:1\">1.3 MB<\u002Fdiv>\n<div style=\"font-size:16px;color:#6C6C76;overflow-wrap:anywhere\">{{hostLabel}} · took 2 s<\u002Fdiv>\n\n<div style=\"margin-top:20px;width:100%;max-width:640px;padding:26px 28px;border-radius:28px;background:#17171A;border:1px solid #25252A;display:flex;flex-direction:column;gap:20px;box-sizing:border-box;text-align:left\">\n<div style=\"display:flex;flex-direction:column;gap:12px\">\n<div style=\"display:flex;justify-content:space-between;gap:12px;font-size:16px\"><span style=\"color:#9A9AA6\">Downloaded<\u002Fspan><span style=\"font-weight:700\"> ี่พบบ่อย<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<details style=\"border-radius:16px;background:#131317;border:1px solid #232329;padding:0 24px\">\n<summary style=\"display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 0;font-weight:600;font-size:17px\">ใช้กับระบบอะไรได้บ้าง<span class=\"plus\" style=\"flex:none;font-size:24px;line-height:1;color:#6EE7B7;transition:transform .2s\">+<\u002Fspan><\u002Fsummary>\n<p style=\"margin:0 0 20px;color:#A9A9B4;font-size:15px\">ตอนนี้เป็นแอปเดสก์ท็อปสำหรับ Windows (.exe) สร้างด้วย C# บน .NET 8<\u002Fp>\n<\u002Fdetails>\n<details style=\"border-radius:16px;background:#131317;border:1px solid #232329;padding:0 24px\">\n<summary style=\"display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 0;font-weight:600;font-size:17px\">ไฟล์เดียวกับแยกไฟล์ ต่างกันอย่างไร<span class=\"plus\" style=\"flex:none;font-size:24px;line-height:1;color:#6EE7B7;transition:transform .2s\">+<\u002Fspan><\u002Fsummary>\n<p style=\"margin:0 0 20px;color:#A9A9B4;font-size:15px\">โหมดไฟล์เดียวฝังทุกอย่างลงใน .html ไฟล์เดียว ส่งต่อง่าย แต่ไฟล์ใหญ่กว่า โหมดแยกไฟล์ได้ index.html กับโฟลเดอร์ css, js, images เหมาะกับการเปิดแก้ไข<\u002Fp>\n<\u002Fdetails>\n<details style=\"border-radius:16px;background:#131317;border:1px solid #232329;padding:0 24px\">\n<summary style=\"display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 0;font-weight:600;font-size:17px\">ตั้งค่าอะไรได้บ้าง<span class=\"plus\" style=\"flex:none;font-size:24px;line-height:1;color:#6EE7B7;transition:transform .2s\">+<\u002Fspan><\u002Fsummary>\n<p style=\"margin:0 0 20px;color:#A9A9B4;font-size:15px\">ปรับ timeout และ user-agent ของคำขอได้ การดึงไฟล์ทำพร้อมกันหลายไฟล์<\u002Fp>\n<\u002Fdetails>\n<details style=\"border-radius:16px;background:#131317;border:1px solid #232329;padding:0 24px\">\n<summary style=\"display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 0;font-weight:600;font-size:17px\">เปิดซอร์สโค้ดให้ดูไหม<span class=\"plus\" style=\"flex:none;font-size:24px;line-height:1;color:#6EE7B7;transition:transform .2s\">+<\u002Fspan><\u002Fsummary>\n<p style=\"margin:0 0 20px;color:#A9A9B4;font-size:15px\">เปิดให้ดูแบบสาธารณะบน GitHub ในชื่อรีโป Web-Cloner รวมถึงสคริปต์ GitHub Actions ที่ใช้สร้างรุ่นสำหรับปล่อย<\u002Fp>\n<\u002Fdetails>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section style=\"max-width:1160px;margin:0 auto;padding:24px 24px 96px\">\n<div style=\"position:relative;overflow:hidden;border-radius:30px;border:1px solid #2A2A31;background:#101013;padding:72px 32px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:20px\">\n<h2 class=\"h2\" style=\"position:relative;margin:0;font-size:46px;line-height:1.2;font-weight:700;letter-spacing:-0.02em;text-wrap:balance;max-width:720px\">เก็บเว็บที่ต้องการ ในแบบที่ใช้ต่อได้<\u002Fh2>\n<p style=\"position:relative;margin:0;color:#A9A9B4;font-size:18px;max-width:520px\">ดูโค้ด วิธีสร้าง และรุ่นล่าสุดได้ที่ GitHub<\u002Fp>\n<div style=\"position:relative;margin-top:6px;display:flex;flex-wrap:wrap;justify-content:center;gap:12px\">\n<a class=\"btn-main\" href=\"https://github.com/b62082826-gif/Web-Cloner\" style=\"padding:15px 32px;border-radius:999px;background:#F4F4F6;color:#0B0B0D;font-weight:600;font-size:17px\">เปิดรีโปบน GitHub<\u002Fa>\n<a class=\"btn-ghost\" href=\"https://discord.gg/cwxeXehAFX\" style=\"padding:15px 32px;border-radius:999px;background:#17171C;border:1px solid #2A2A31;color:#F4F4F6;font-weight:500;font-size:17px\">เข้า Discord<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<footer style=\"border-top:1px solid #1C1C21\">\n<div style=\"max-width:1160px;margin:0 auto;padding:28px 24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;font-size:14px;color:#8E8E99\">\n<span style=\"display:flex;align-items:center;gap:10px;color:#C9C9D2;font-weight:600\">\n<svg width=\"22\" height=\"22\" viewBox=\"0 0 32 32\" aria-hidden=\"true\"><rect width=\"32\" height=\"32\" rx=\"9\" fill=\"#F4F4F6\"><\u002Frect><path d=\"M7 10l3.2 12 3.3-9 3.3 9L20 10M20.5 10l2.6 12 2.4-12\" fill=\"none\" stroke=\"#0B0B0D\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" transform=\"translate(-1.5 0) scale(.96 1)\"><\u002Fpath><\u002Fsvg>WebGrabber Pro\n<\u002Fspan>\n<span style=\"display:flex;flex-wrap:wrap;gap:8px 24px\"><a href=\"https://github.com/b62082826-gif/Web-Cloner\">github.com/b62082826-gif/Web-Cloner<\u002Fa><a href=\"https://discord.gg/cwxeXehAFX\">Discord<\u002Fa><\u002Fspan>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fsc-if><\u002Fx-dc>\n\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#6EE7B7&quot;,&quot;options&quot;:[&quot;#6EE7B7&quot;,&quot;#7DD3FC&quot;,&quot;#FCD34D&quot;,&quot;#F9A8D4&quot;]},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:4900}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { url: 'https://example.com', mode: 'single', phase: 'form', p: 0 };\n    this._timer = null;\n  }\n\n  componentWillUnmount() {\n    if (this._timer) clearInterval(this._timer);\n  }\n\n  host(url) {\n    try {\n      const u = new URL(/^[a-z]+:\\/\\//i.test(url) ? url : 'https://' + url);\n      return u.hostname || 'example.com';\n    } catch (e) {\n      return 'example.com';\n    }\n  }\n\n  renderVals() {\n    const accent = this.props.accent ?? '#6EE7B7';\n    const s = this.state;\n    const single = s.mode === 'single';\n    const busy = s.phase === 'busy';\n    const ON = '#2A2A2F', OFF = 'transparent';\n\n    return {\n      accent,\n      url: s.url,\n      setUrl: (e) => this.setState({ url: e.target.value }),\n      usePaste: () => this.setState({ url: 'https://example.com' }),\n      isSingle: single,\n      isSplit: !single,\n      singleBg: single ? ON : OFF,\n      singleColor: single ? '#F4F4F6' : '#8D8D96',\n      splitBg: !single ? ON : OFF,\n      splitColor: !single ? '#F4F4F6' : '#8D8D96',\n      pickSingle: () => this.setState({ mode: 'single' }),\n      pickSplit: () => this.setState({ mode: 'split' }),\n      hint: single\n        ? 'Packs everything into one .html file. Easy to share, but larger.'\n        : 'Saves index.html with css, js and images folders. Easy to edit.',\n      showForm: s.phase !== 'done',\n      showDone: s.phase === 'done',\n      progress: s.p,\n      startLabel: busy ? 'Grabbing…' : 'Download website',\n      startOpacity: busy ? 0.6 : 1,\n      hostLabel: this.host(s.url.trim()),\n      start: () => {\n        if (busy) return;\n        if (this._timer) clearInterval(this._timer);\n        this.setState({ phase: 'busy', p: 0 });\n        this._timer = setInterval(() => {\n          const next = this.state.p + 7;\n          if (next >= 100) {\n            clearInterval(this._timer);\n            this._timer = null;\n            this.setState({ p: 100, phase: 'done' });\n          } else {\n            this.setState({ p: next });\n          }\n        }, 110);\n      },\n      reset: () => this.setState({ phase: 'form', p: 0 })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
