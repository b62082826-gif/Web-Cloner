
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGrabber Pro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="titlebar">
        <div class="brand">WEBGRABBER PRO</div>

        <div class="window-buttons">
            <button onclick="send('minimize')">—</button>
            <button onclick="send('close')">✕</button>
        </div>
    </div>

    <main class="container">
        <h1>Website Downloader</h1>
        <div class="subtitle">
            Download website files and save them locally.
        </div>

        <section class="panel">
            <label>Website URL</label>
            <input
                id="url"
                type="url"
                placeholder="https://example.com"
            >

            <label>Save Location</label>

            <div class="folder-row">
                <input
                    id="folder"
                    type="text"
                    placeholder="Select output folder..."
                    readonly
                >

                <button class="secondary" onclick="send('browse')">
                    Browse
                </button>
            </div>

            <label>Download Mode</label>

            <select id="mode">
                <option value="separated">Separated Assets</option>
                <option value="single">Single HTML Bundle (Coming Soon)</option>
            </select>

            <button
                id="download"
                class="primary"
                onclick="downloadWebsite()"
            >
                DOWNLOAD WEBSITE
            </button>

            <button
                id="cancel"
                class="cancel"
                onclick="send('cancel')"
            >
                CANCEL DOWNLOAD
            </button>

            <div class="progress-area">
                <div class="progress-info">
                    <span id="progressText">Ready</span>
                    <span id="percent">0%</span>
                </div>

                <div class="progress-track">
                    <div id="progress" class="progress-fill"></div>
                </div>
            </div>

            <div id="status">Ready to download.</div>
        </section>

        <div class="footer">
            WEBGRABBER PRO · WINDOWS DESKTOP APPLICATION
        </div>
    </main>

    <script>
        const $ = id => document.getElementById(id);

        function send(action, data = {}) {
            if (window.chrome?.webview) {
                window.chrome.webview.postMessage({
                    action,
                    data
                });
            }
        }

        function downloadWebsite() {
            const url = $("url").value.trim();
            const folder = $("folder").value.trim();

            if (!url || !folder) {
                showStatus("Please enter URL and select folder.", "error");
                return;
            }

            send("download", {
                url,
                outputFolder: folder,
                mode: $("mode").value
            });
        }

        function showStatus(message, type = "") {
            $("status").textContent = message;
            $("status").className = type;
        }

        if (window.chrome?.webview) {
            window.chrome.webview.addEventListener(
                "message",
                event => {
                    const data = event.data;

                    if (data.type === "folder") {
                        $("folder").value = data.path;
                    }

                    if (data.type === "started") {
                        $("download").disabled = true;
                        $("cancel").style.display = "block";
                        $("progress").style.width = "0%";
                        $("percent").textContent = "0%";
                        showStatus(data.message);
                    }

                    if (data.type === "progress") {
                        $("progress").style.width = data.percent + "%";
                        $("percent").textContent = data.percent + "%";
                        $("progressText").textContent = data.message;
                    }

                    if (data.type === "done") {
                        finish();
                        $("progress").style.width = "100%";
                        $("percent").textContent = "100%";
                        showStatus(data.message + ": " + data.path, "success");
                    }

                    if (data.type === "cancelled") {
                        finish();
                        showStatus(data.message);
                    }

                    if (data.type === "error") {
                        finish();
                        showStatus(data.message, "error");
                    }
                }
            );
        }

        function finish() {
            $("download").disabled = false;
            $("cancel").style.display = "none";
        }
    </script>
</body>
</html>
