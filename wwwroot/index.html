<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGrabber Pro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="titlebar" id="titlebar">
        <div class="brand">WEBGRABBER PRO</div>

        <div class="window-buttons">
            <button id="minimize" title="Minimize">—</button>
            <button id="close" class="close" title="Close">✕</button>
        </div>
    </div>

    <main class="container">
        <h1>Website Downloader</h1>
        <div class="subtitle">
            Download website files and save them locally.
        </div>

        <section class="panel">
            <label for="url">Website URL</label>
            <input
                id="url"
                type="url"
                placeholder="https://example.com"
                autocomplete="off"
                spellcheck="false"
            >

            <label for="folder">Save Location</label>

            <div class="folder-row">
                <input
                    id="folder"
                    type="text"
                    placeholder="Select output folder..."
                    readonly
                >

                <button id="browse" class="secondary" type="button">
                    Browse
                </button>
            </div>

            <label for="mode">Download Mode</label>

            <select id="mode">
                <option value="separated">Separated Assets (index.html + css / js / images / fonts)</option>
                <option value="single">Single HTML Bundle (one standalone .html)</option>
            </select>

            <div id="modeHint" class="hint"></div>

            <button id="download" class="primary" type="button">
                DOWNLOAD WEBSITE
            </button>

            <button id="cancel" class="cancel" type="button">
                CANCEL DOWNLOAD
            </button>

            <div class="progress-area">
                <div class="progress-info">
                    <span id="progressText">Ready</span>
                    <span id="percent">0%</span>
                </div>

                <div class="progress-track">
                    <div id="progress" class="progress-fill"></div>
                </div>
            </div>

            <div id="status">Ready to download.</div>

            <div id="result" class="result">
                <div id="resultStats" class="result-stats"></div>

                <div class="result-actions">
                    <button id="openFolder" class="secondary" type="button">
                        Show in folder
                    </button>

                    <button id="openFile" class="secondary" type="button">
                        Open in browser
                    </button>
                </div>
            </div>
        </section>

        <div class="footer">
            WEBGRABBER PRO · WINDOWS DESKTOP APPLICATION
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
