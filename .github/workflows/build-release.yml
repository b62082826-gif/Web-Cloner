name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish (win-x64, self-contained, single file)
        run: >
          dotnet publish WebGrabber.Pro.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:Version=1.0.${{ github.run_number }}
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath WebGrabberPro-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: WebGrabberPro-win-x64
          path: WebGrabberPro-win-x64.zip

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          # tag v* -> release ชื่อตาม tag, push เข้า main -> release ชื่อ build-<เลขรัน>
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          files: WebGrabberPro-win-x64.zip
          body_path: CHANGELOG.md
