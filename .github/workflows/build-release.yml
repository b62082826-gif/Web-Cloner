name: Build & Release

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish (win-x64, self-contained, single file)
        run: >
          dotnet publish WebGrabber.Pro.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath WebGrabberPro-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: WebGrabberPro-win-x64
          path: WebGrabberPro-win-x64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: WebGrabberPro-win-x64.zip
          generate_release_notes: true
